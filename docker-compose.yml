services:
  backend:
    build: ./backend
    container_name: medai-backend
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_DIR=/data/uploads
      - MODELS_DIR=/models
      - OUTPUTS_DIR=/data/outputs
      - TEMP_DIR=/data/tmp
      - OLLAMA_BASE_URL=http://ollama:11434
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-change-me}
    volumes:
      - ./backend:/app
      - ./chroma_db:/app/chroma_db
      - ./models:/models
      - medai_data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: medai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  auth:
    build: ./auth_service
    container_name: medai-auth
    ports:
      - "9000:9000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-true}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - POSTGRES_DB=${POSTGRES_DB:-medai_auth}
      - POSTGRES_USER=${POSTGRES_USER:-medai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-medai}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-change-me}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@corpusmedica.ai}
      - SMTP_BACKEND=${SMTP_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - SMTP_TIMEOUT=${SMTP_TIMEOUT:-15}
    volumes:
      - ./auth_service:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: medai-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-medai_auth}
      - POSTGRES_USER=${POSTGRES_USER:-medai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-medai}
    volumes:
      - auth_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  medai_data:
  ollama_models:
  auth_db:
