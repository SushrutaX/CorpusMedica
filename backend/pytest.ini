[pytest]
# Pytest configuration for CorpusMedica backend tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require full app setup)
    slow: Slow tests that take a long time to run

# Asyncio mode
asyncio_mode = auto
